name: F1 News

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run = normal, check = test reading the sites, test = send a test draft"
        default: "run"
        type: choice
        options:
          - run
          - check
          - test

permissions:
  contents: write

concurrency:
  group: f1-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run news bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python f1_news.py ${{ inputs.mode || 'run' }}

      - name: Save state
        if: ${{ always() }}
        run: |
          if [ -n "$(git status --porcelain news_state.json)" ]; then
            git config user.name "f1-bot"
            git config user.email "f1-bot@users.noreply.github.com"
            git add news_state.json
            git commit -m "update news state"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              sleep 3
            done
          fi
