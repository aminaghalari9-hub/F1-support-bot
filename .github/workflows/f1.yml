name: F1 Bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "once = normal, test = send next race schedule now"
        default: "once"
        type: choice
        options:
          - once
          - test

permissions:
  contents: write

concurrency:
  group: f1-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          STREAM_LINK: ${{ vars.STREAM_LINK }}
        run: python f1_bot.py ${{ inputs.mode || 'once' }}

      - name: Save state
        run: |
          if [ -n "$(git status --porcelain sent.json)" ]; then
            git config user.name "f1-bot"
            git config user.email "f1-bot@users.noreply.github.com"
            git add sent.json
            git commit -m "update state"
            git push
          fi
